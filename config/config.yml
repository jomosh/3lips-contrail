radar:
  - name: radar4
    url: "radar4.30hours.dev"
  - name: radar5
    url: "radar5.30hours.dev"
  - name: radar6
    url: "radar6.30hours.dev"

associate:
  adsb:
    tDelete: 5
  geometric:
    threshold: 500        # metres — spatial proximity for intersection test
    nSamples: 50          # ellipse samples per detection
    doppler_tolerance: 5  # Hz — Doppler sign-consistency filter
    max_detections: 20    # per-radar guard; skip epoch above this

tracker:
  ekf:
    process_noise_q: 1.0       # m²/s³ — continuous white noise acceleration
    measurement_noise_r: 2500  # m² — bistatic range variance (~50m std)
    init_pos_sigma: 500        # metres — initial position uncertainty (std dev)
    init_vel_sigma: 50         # m/s — initial velocity uncertainty (std dev)
  jipda:
    P_D: 0.9                   # probability of detection
    P_G: 0.999                 # gate probability
    gamma: 16.27               # chi² 3-DOF at P=0.999
    P_exist_threshold: 0.1     # auto-delete tracks below this
    confirmation_epochs: 2     # M/N = 2/2 for track initiation
    confirmation_gate: 2000    # metres — spatial gate for confirming pending tracks
    max_tracks: 20

localisation:
  ellipse:                      # 2D (ground-level) parametric localisation
    nSamples: 100               # azimuth samples around each ellipse
    threshold: 500              # metres — max distance for intersection match
    nDisplay: 50                # ellipsoid points rendered on the map
  ellipsoid:                    # 3D parametric localisation
    nSamples: 60                # azimuth samples (lower — more CPU per sample)
    threshold: 500              # metres — max distance for intersection match
    nDisplay: 50                # ellipsoid points rendered on the map

map:
  location:
    latitude: 51.5074
    longitude: -0.1278
  center_width: 50000
  center_height: 40000
  # Set to false to hide radar TX/RX site locations on the map and from the
  # public API.  When false, /api/proxy/config returns 403 and no site pins
  # are drawn.  The event loop continues to use radar config internally.
  show_radar_sites: true
  # Default tile servers point at public OSM/CARTO/OpenTopoMap endpoints.
  # These services have usage policies and rate limits; for production use
  # replace these values with your own tile proxy or self-hosted tile server.
  tile_server:
    osm: tile.openstreetmap.org/
    carto_light: basemaps.cartocdn.com/light_all/
    carto_dark: basemaps.cartocdn.com/dark_all/
    opentopomap: tile.opentopomap.org/
  tar1090: "adsb.30hours.dev"
  tar1090_https: false

event:
  interval: 0.5                    # seconds between backend polling cycles
  http:
    request_timeout: 1.0           # seconds — per-request timeout for radar/truth HTTP fetches
    connect_timeout: 1.0           # seconds — TCP connect timeout
    total_timeout: 5.0             # seconds — session-level safety net timeout
    limit: 20                      # max concurrent connections across all hosts
    limit_per_host: 5              # max concurrent connections to any single host
    dns_cache_ttl: 300             # seconds — DNS cache TTL
  cache:
    config_refresh_interval: 60    # seconds between background radar config cache refreshes

3lips:
  save: true
  # ~5–10 KB per epoch (1 Hz) ≈ 430–860 MB/day, so 100 MB keeps individual
  # files small enough to inspect/download while lasting a couple of hours.
  save_max_bytes: 100000000        # rotate to a new .ndjson file when the current file exceeds this (bytes; 0 = unlimited)
  # 1 GB bounds the whole save/ directory to roughly a day of capture at
  # default rates; 0 disables the cap.
  save_max_total_bytes: 1000000000 # delete oldest .ndjson files when save/ total exceeds this (bytes; 0 = unlimited)
  tDelete: 60                      # seconds of inactivity before removing an API session
