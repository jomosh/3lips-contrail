<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Use correct character set. -->
    <meta charset="utf-8"/>
    <!-- Tell IE to use the latest, best version. -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <!-- Make the application on mobile take up the full browser screen and disable user scaling. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"/>
    <title>3lips-contrail Map</title>
    <link rel="stylesheet" href="lib/maplibre-gl.css" />
    <script src="lib/maplibre-gl.js"></script>
    <style>
      html,
      body,
      #mapContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #layer-switcher {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 4px;
        padding: 6px 8px;
        font-family: sans-serif;
        font-size: 13px;
      }
      #layer-switcher strong {
        display: block;
        margin-bottom: 4px;
      }
      #layer-switcher button {
        display: block;
        width: 100%;
        margin-bottom: 4px;
        padding: 4px 8px;
        cursor: pointer;
        border: 1px solid #aaa;
        border-radius: 3px;
        background: #f0f0f0;
      }
      #layer-switcher button.active {
        background: #4a90d9;
        color: white;
        border-color: #3a80c9;
      }

      /* Settings cog button */
      #settings-cog {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 3;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border: none;
        font-size: 18px;
        line-height: 32px;
        text-align: center;
        cursor: pointer;
        padding: 0;
      }
      #settings-cog:hover {
        background: rgba(0, 0, 0, 0.8);
      }

      /* Settings popup */
      #settings-popup {
        display: none;
        position: absolute;
        top: 48px;
        left: 10px;
        z-index: 3;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        border-radius: 6px;
        padding: 10px 14px;
        font-family: sans-serif;
        font-size: 13px;
        min-width: 140px;
      }
      #settings-popup button {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 6px 10px;
        cursor: pointer;
        border: 1px solid #666;
        border-radius: 4px;
        background: rgba(255,255,255,0.15);
        color: #fff;
        font-size: 13px;
      }
      #settings-popup button:hover {
        background: rgba(255,255,255,0.3);
      }

      /* Altitude legend bar — sits at bottom-centre of map */
      #altitude-legend {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        background: rgba(0, 0, 0, 0.65);
        border-radius: 6px;
        padding: 6px 10px 4px 10px;
        font-family: sans-serif;
        pointer-events: none;
      }
      #altitude-legend .legend-gradient {
        width: 1000px;
        height: 8px;
        border-radius: 3px;
        background: linear-gradient(
          to right,
          hsl(30, 80%, 55%) 0%,       /* orange       0m    →   0% */
          hsl(30, 80%, 55%) 1.25%,     /* orange       150m  →   1.25% */
          hsl(35, 80%, 55%) 2.5%,      /* lighter orange  300m  →   2.5% */
          hsl(42, 80%, 55%) 5%,        /* orange-yellow   600m  →   5% */
          hsl(55, 80%, 55%) 10%,       /* yellow         1200m  →  10% */
          hsl(75, 80%, 55%) 15%,       /* yellow-green   1800m  →  15% */
          hsl(95, 80%, 55%) 20%,       /* yellowish green 2400m  →  20% */
          hsl(120, 80%, 55%) 25%,      /* green          3000m  →  25% */
          hsl(195, 80%, 55%) 50%,      /* light blue     6000m  →  50% */
          hsl(230, 80%, 55%) 75%,      /* blue           9000m  →  75% */
          hsl(280, 80%, 55%) 100%      /* purple        12000m  → 100% */
        );
      }
      #altitude-legend .legend-labels {
        position: relative;
        color: rgba(255, 255, 255, 0.85);
        font-size: 8px;
        padding: 2px 0 0 0;
        width: 1000px;
        height: 14px;
      }
      #altitude-legend .legend-labels span {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      #altitude-legend .legend-title {
        color: rgba(255, 255, 255, 0.75);
        font-size: 9px;
        text-align: center;
        margin-bottom: 2px;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div id="mapContainer"></div>

    <!-- Settings cog -->
    <button id="settings-cog" title="Settings" onclick="toggleSettingsPopup()">&#9881;</button>
    <div id="settings-popup">
      <strong>Altitude display</strong>
      <button id="btn-alt-unit" onclick="toggleAltitudeUnit()">Unit: metres</button>
      <div style="margin-top:12px;">
        <strong>Min radars for ellipsoids</strong>
        <input type="number" id="input-min-radar-ellipsoids" min="1" max="10" value="3"
          style="display:block;width:100%;margin-top:4px;padding:4px 6px;border:1px solid #666;border-radius:4px;background:rgba(255,255,255,0.1);color:#fff;font-size:13px;box-sizing:border-box;"
          onchange="setMinRadarEllipsoids(this.value)">
      </div>
      <div style="margin-top:12px;">
        <strong>Ellipsoid fade time (s)</strong>
        <input type="number" id="input-ellipsoid-fade" min="0" max="60" value="0"
          style="display:block;width:100%;margin-top:4px;padding:4px 6px;border:1px solid #666;border-radius:4px;background:rgba(255,255,255,0.1);color:#fff;font-size:13px;box-sizing:border-box;"
          onchange="setEllipsoidFadeTime(this.value)">
      </div>
      <div style="margin-top:8px;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="input-show-cooperative" checked
            onchange="setShowCooperativeTargets(this.checked)">
          <span>Show cooperative targets</span>
        </label>
      </div>
    </div>

    <div id="layer-switcher">
      <strong>Tiles</strong>
      <button id="btn-osm" class="active" onclick="switchTileLayer('osm')">OSM</button>
      <button id="btn-carto_light" onclick="switchTileLayer('carto_light')">Carto Light</button>
      <button id="btn-carto_dark" onclick="switchTileLayer('carto_dark')">Carto Dark</button>
      <button id="btn-opentopomap" onclick="switchTileLayer('opentopomap')">OpenTopoMap</button>
    </div>

    <!-- Altitude colour legend bar -->
    <div id="altitude-legend">
      <div class="legend-title">ALTITUDE</div>
      <div class="legend-gradient"></div>
      <div class="legend-labels" id="legend-labels">
        <span>0m</span>
        <span>300m</span>
        <span>600m</span>
        <span>1200m</span>
        <span>1800m</span>
        <span>2400m</span>
        <span>3000m</span>
        <span>6000m</span>
        <span>9000m</span>
        <span>12000m</span>
      </div>
    </div>

    <script src="lib/jquery-3.6.0.min.js"></script>
    <script src="event/adsb.js"></script>
    <script src="event/radar.js"></script>
    <script src="event/ellipsoid.js"></script>
    <script src="main.js"></script>
  </body>
</html>
